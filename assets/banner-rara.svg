    <text x="66" y="388" font-size="24" font-weight="500" fill="#3F6B67">Konsultasi kesehatan awal</text>
    <text x="66" y="420" font-size="24" font-weight="500" fill="#3F6B67">langsung dari WhatsApp kamu.</text>
